services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: kpi
      POSTGRES_DB: kpi
    ports:
      # Host 5432 was already bound to an unrelated container
      # (portable_postgres) on this machine. Remapped to 5433; container
      # port stays 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kpi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
