<div class="empty-state">
  <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="11" cy="11" r="8"></circle>
    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    <line x1="8" y1="11" x2="14" y2="11"></line>
  </svg>
  <div class="empty-state-title">{{ empty_title or 'No records found' }}</div>
  <p class="empty-state-desc">{{ empty_desc or 'There are no items matching the selected criteria.' }}</p>
  {% if empty_action_url %}
  <div style="margin-top: 14px;">
    <a href="{{ empty_action_url }}" class="btn btn-sm">{{ empty_action_text or 'Clear Filters' }}</a>
  </div>
  {% endif %}
</div>
