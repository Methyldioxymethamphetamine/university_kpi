# Source registry — India.
#
# A source is DATA, not code. Adding an institution, a year, a rank band or a
# pasted URL is an edit to this file and nothing else. If a new source requires
# a code change in acquire/, the abstraction is wrong (see PROMPTS.md P2A).
#
# Two entry types share ONE fetch path:
#   type: pattern     templated URL + enumerator
#   type: adhoc_url   a single pasted URL
#
# robots_checked_at / terms_reviewed_at are filled by a HUMAN before any full
# run. Claude Code must leave them null and surface them as [OPEN].

country: IN

verified_retrieval:
  # Confirmed by fetching during the source investigation. [VERIFIED]
  nirf_pdf_pattern: "https://www.nirfindia.org/nirfpdfcdn/{year}/pdf/{category}/{institution_id}.pdf"
  wordpress_media_api: "{origin}/wp-json/wp/v2/media?per_page=100&search={q}&_fields=source_url,title"

sources:

  - source_id: nirf_iitb_overall
    type: pattern
    institution_code: IR-O-U-0306
    institution_name: Indian Institute of Technology Bombay
    pattern: nirf_pdf_pattern
    params:
      category: Overall
      institution_id: IR-O-U-0306
    enumerator:
      years: [2024, 2025]
    expected_content_type: application/pdf
    period_type: academic_year
    robots_checked_at: null      # [OPEN]
    terms_reviewed_at: null      # [OPEN]

  - source_id: sandip_sitrc_overall
    type: pattern
    institution_code: IR-O-C-41520
    institution_name: Sandip Institute of Technology and Research Centre
    # Sandip is a NIRF participant but NOT ranked, so nirfindia.org publishes no
    # PDF. The institution's own WordPress site does. [VERIFIED]
    pattern: wordpress_media_api
    params:
      origin: "https://sitrc.sandipfoundation.org"
      q: nirf
    # NOT a templated filter. Fetching the real media API during P2A
    # [VERIFIED, 2026-09-14] showed the filename/title convention is NOT
    # stable across years: 2025 is "NIRF Report 2025_Overall" but 2024 is
    # "Submitted Institute Data for NIRF 2024 _Overall" -- a single
    # "NIRF-Report-{year}_Overall" template (the original draft here) matches
    # 2025 and silently matches nothing for 2024. Per P-12, each substring
    # below was read off an actual fetched response, not guessed or
    # extrapolated from the 2025 shape.
    enumerator:
      matches:
        - year: 2025
          title_contains: "NIRF Report 2025_Overall"
        - year: 2024
          title_contains: "Submitted Institute Data for NIRF 2024 _Overall"
    expected_content_type: application/pdf
    period_type: academic_year
    robots_checked_at: null      # [OPEN]
    terms_reviewed_at: null      # [OPEN]
    # [VERIFIED, 2026-09-14] sitrc.sandipfoundation.org/robots.txt disallows
    # "*.pdf" and "/pdf/" for User-agent: * (confirmed against the real
    # robots.txt with protego, the library Scrapy's RobotsTxtMiddleware
    # uses). The /wp-json/wp/v2/media discovery call above is NOT blocked;
    # the actual PDF download that the discovery call points to IS blocked.
    # With ROBOTSTXT_OBEY=True (required by PROMPTS.md P2A) this source's
    # PDF cannot be fetched at all under this or any other well-behaved
    # user agent. See gate/P2A-acquire.md for the full finding.

  # Example of the second entry type. A pasted link is a registry entry.
  # - source_id: adhoc_example
  #   type: adhoc_url
  #   url: "https://example.edu/disclosure.pdf"
  #   institution_code: null
  #   expected_content_type: null
  #   robots_checked_at: null
  #   terms_reviewed_at: null
