[project]
name = "kpi-pipeline"
version = "0.1.0"
description = "University KPI benchmarking: acquisition, extraction and storage layer"
requires-python = ">=3.11"

dependencies = [
  "scrapy>=2.14",
  "docling>=2.0",
  "docling-core>=2.83",
  "pypdfium2>=4",
  "psycopg[binary]>=3.2",
  "pyyaml>=6",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

# NOTE: pypdfium2 (Apache-2.0/BSD) is used for coordinate-level checks instead
# of PyMuPDF/fitz. This was originally a client-licensing choice (PyMuPDF is
# AGPL-3.0); that constraint doesn't apply to a college project, so PyMuPDF is
# fine to use too if it's ever a better fit. pypdfium2 is kept as the default
# only because P1 (see CLAUDE.md) was already verified against it.

[tool.pytest.ini_options]
testpaths = ["tests"]

# No importable package exists yet (iteration 1 has not written code under a
# package dir). Without this, setuptools' flat-layout auto-discovery sees the
# scaffold directories (raw/, notes/, findings/, ...) and refuses to guess.
# Remove/replace once P1+ adds real source under e.g. src/kpi_pipeline/.
[tool.setuptools]
packages = []
